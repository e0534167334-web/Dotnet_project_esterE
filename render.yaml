# Render Blueprint: שרת ה-API (Docker) + PostgreSQL. כל push ל-main מפעיל deploy מחדש
services:
  - type: web
    name: baby-clinic-api
    runtime: docker
    plan: free
    branch: main
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    healthCheckPath: /swagger/index.html
    envVars:
      # הגדרות משותפות מה-Environment Group (מוגדר למטה)
      - fromGroup: baby-clinic-settings
      # משתנים שלא יכולים לשבת בקבוצה: הפניה למסד הנתונים וערך שמוזן ידנית (sync: false)
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: baby-clinic-db
          property: connectionString
      # כתובת הלקוח (React) ב-Render - מוזנת ידנית ב-Dashboard
      - key: Cors__AllowedOrigins__0
        sync: false

# Environment Group: נוצר ב-Render כקבוצה עצמאית שאפשר לערוך במקום אחד ולקשר לשירותים נוספים
envVarGroups:
  - name: baby-clinic-settings
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: PORT
        value: "8080"
      # מפתח אקראי שנוצר פעם אחת ב-Render (44 תווים, מעל 32 הבתים הנדרשים)
      - key: Jwt__Key
        generateValue: true

databases:
  - name: baby-clinic-db
    plan: free
    databaseName: baby_clinic
    user: baby_clinic
