# Render Blueprint: שרת ה-API (Docker) + PostgreSQL. כל push ל-main מפעיל deploy מחדש
services:
  - type: web
    name: baby-clinic-api
    runtime: docker
    plan: free
    branch: main
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    healthCheckPath: /swagger/index.html
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: PORT
        value: "8080"
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: baby-clinic-db
          property: connectionString
      # מפתח אקראי שנוצר פעם אחת ב-Render (44 תווים, מעל 32 הבתים הנדרשים)
      - key: Jwt__Key
        generateValue: true
      # כתובת הלקוח (React) כשיעלה - לעדכן ידנית ב-Dashboard
      - key: Cors__AllowedOrigins__0
        sync: false

databases:
  - name: baby-clinic-db
    plan: free
    databaseName: baby_clinic
    user: baby_clinic
